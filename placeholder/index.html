<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nirbhay &amp; Riya — 5-7 December 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f7f2e6; --ink: #16263f; --soft: #5d6470; --gold: #b98c2e; --gold-dark: #8a6a2a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--cream);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='52' height='52'><path d='M26 18l4 8-4 8-4-8z' fill='%23b98c2e' fill-opacity='0.05'/></svg>");
    color: var(--ink); font-family: 'Cormorant Garamond', serif; text-align: center; padding: 40px 22px;
  }
  .inner { max-width: 640px; }
  .monogram { font-family: 'Jost', sans-serif; font-size: 15px; letter-spacing: 0.5em; color: var(--gold-dark); margin-bottom: 26px; }
  h1 { font-weight: 500; font-size: clamp(44px, 10vw, 88px); letter-spacing: 0.03em; line-height: 1.05; color: var(--ink); }
  .rule { width: 110px; height: 2px; margin: 26px auto; background: linear-gradient(90deg, transparent, var(--gold), transparent); border: none; }
  .when { font-family: 'Jost', sans-serif; font-size: 14px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--ink); }
  .city { margin-top: 10px; font-size: 20px; font-style: italic; color: var(--soft); }
  .soon { margin-top: 44px; font-family: 'Jost', sans-serif; font-size: 12px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold-dark); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
</style>
</head>
<body>
  <div class="inner">
    <div class="monogram">N · R</div>
    <h1>Nirbhay &amp; Riya</h1>
    <div class="rule"></div>
    <div class="when">05 · 06 · 07 December 2026</div>
    <div class="city">Chandigarh</div>
    <div class="soon">The invitation is on its way — check back soon</div>
  </div>
</body>
</html>
